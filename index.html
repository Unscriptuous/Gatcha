<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #302020, #090606);
            font-family: Arial, sans-serif;
            color: white;
            padding: 25px;
        }

        .machine {
            position: relative;
            background: linear-gradient(145deg, #a51616, #350000);
            border: 9px solid #d6a43b;
            border-radius: 35px;
            padding: 35px 100px 45px 35px;
            box-shadow:
                0 0 45px #a80000,
                inset 0 0 30px #ff3838,
                0 0 15px gold;
            text-align: center;
            width: min(96vw, 1150px);
        }

        h1 {
            background: linear-gradient(90deg, #fff176, #ff9800, #fff176);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 38px;
            margin: 18px 0;
            text-shadow: 0 0 15px #ff9800;
        }

        .subtitle {
            color: #ffdf75;
            letter-spacing: 7px;
            font-size: 14px;
            margin-top: 10px;
        }

        .bulb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: red;
            margin: auto;
            box-shadow: 0 0 15px red, 0 0 35px red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            to {
                box-shadow: 0 0 25px red, 0 0 55px red;
            }
        }

        /* SLOT DISPLAY */

        .display {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 12px;
            padding: 22px 16px;
            background: linear-gradient(145deg, #050505, #252020);
            border: 5px solid gold;
            border-radius: 22px;
            margin: 35px 0;
            box-shadow:
                0 0 25px #ffb300,
                inset 0 0 15px #555;
        }

        .reel-box {
            min-width: 0;
        }

        .reel-label {
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .reel {
            height: 125px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            padding: 8px 3px;
            overflow-wrap: anywhere;
            background: linear-gradient(145deg, #fff9e6, #e6cfa0);
            border: 3px solid #ffdc75;
            box-shadow:
                inset 0 0 15px #a68c56,
                0 0 12px #ffb300;
            font-size: 15px;
            font-weight: bold;
            color: #a00000;
        }

        .reel .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 9px;
        }

        .reel .value {
            background: linear-gradient(120deg,
                    #4a148c,
                    #ad1457,
                    #6a1b9a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 17px;
            font-weight: 900;
        }

        .reel .number {
            background: linear-gradient(120deg,
                    #a51d00,
                    #e65100,
                    #8b0000);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 24px;
            font-weight: 900;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            to {
                background-position: 200% center;
            }
        }

        .spinning {
            animation: shake .12s infinite;
        }

        @keyframes shake {
            50% {
                transform: translateY(4px);
            }
        }

        /* LEVER */

        .controls {
            position: absolute;
            right: 34px;
            top: 54%;
            transform: translateY(-50%);
        }

        .lever-pivot {
            position: relative;
            width: 55px;
            height: 130px;
        }

        .lever {
            position: absolute;
            bottom: 0;
            left: 30px;
            width: 15px;
            height: 125px;
            background: linear-gradient(to right, #777, #eee, #777);
            border-radius: 10px;
        }

        .bulb-handle {
            position: absolute;
            width: 43px;
            height: 43px;
            top: 5px;
            left: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                    #ff7777,
                    red,
                    #650000);
            box-shadow: 0 0 20px red;
            cursor: grab;
            touch-action: none;
            transition: transform .3s ease;
            z-index: 2;
        }

        .bulb-handle:active {
            cursor: grabbing;
        }

        /* MESSAGE */

        #message {
            color: gold;
            font-size: 23px;
            min-height: 30px;
            margin-top: 30px;
            text-shadow: 0 0 12px orange;
            font-weight: bold;
        }

        .small {
            color: #d8baba;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* SMALL SCREENS */

        @media(max-width: 750px) {

            body {
                padding: 10px;
            }

            .machine {
                padding: 25px 65px 35px 15px;
                border-width: 6px;
            }

            h1 {
                font-size: 24px;
            }

            .display {
                gap: 5px;
                padding: 10px 5px;
            }

            .reel-label {
                font-size: 8px;
                letter-spacing: 0;
                margin-bottom: 8px;
            }

            .reel {
                height: 90px;
                padding: 3px 1px;
                border-width: 2px;
            }

            .reel .emoji {
                font-size: 19px;
                margin-bottom: 5px;
            }

            .reel .number {
                font-size: 14px;
            }

            .reel .value {
                font-size: 10px;
            }

            .controls {
                right: 5px;
            }

            .bulb-handle {
                width: 34px;
                height: 34px;
            }

            .lever-pivot {
                transform: scale(.8);
            }
        }
    </style>
</head>

<body>

    <div class="machine">

        <div class="bulb"></div>

        <h1>🎰 Human Slot Machine 🎰</h1>

        <div class="subtitle">
            ✨ RANDOM PROFILE ✨
        </div>

        <div class="display">

            <div class="reel-box">
                <div class="reel-label">👤 GENDER</div>
                <div class="reel" id="r1">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">🎂 AGE</div>
                <div class="reel" id="r2">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">📏 HEIGHT</div>
                <div class="reel" id="r3">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">⚖️ WEIGHT</div>
                <div class="reel" id="r4">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">💼 JOB</div>
                <div class="reel" id="r5">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">🧠 PERSONALITY</div>
                <div class="reel" id="r6">❔</div>
            </div>

            <div class="reel-box">
                <div class="reel-label">🎮 HOBBY</div>
                <div class="reel" id="r7">❔</div>
            </div>

        </div>

        <div class="controls">
            <div class="lever-pivot">
                <div class="lever"></div>
                <div class="bulb-handle" id="lever"></div>
            </div>
        </div>

        <div id="message">READY? 🎰</div>

    </div>

    <script>

        const categories = [

            [
                ["👨", "Male"],
                ["👩", "Female"]
            ],

            Array.from(
                { length: 113 },
                (_, i) => ["🎂", i]
            ),

            Array.from(
                { length: 300 },
                (_, i) => ["📏", (i) + " cm"]
            ),

            Array.from(
                { length: 400 },
                (_, i) => ["⚖️", (i) + " kg"]
            ),

            [
                ["👨‍⚕️", "Doctor"],
                ["👨‍💻", "Engineer"],
                ["👨‍🏫", "Teacher"],
                ["🎨", "Artist"],
                ["🔬", "Scientist"],
                ["💻", "Programmer"],
                ["👨‍🍳", "Chef"],
                ["✈️", "Pilot"],
                ["⚖️", "Lawyer"],
                ["🏛️", "Architect"],
                ["🎵", "Musician"],
                ["📸", "Photographer"],
                ["✍️", "Writer"],
                ["🎭", "Designer"],
                ["💰", "Business Owner"]
            ],

            [
                ["😎", "Confident"],
                ["🤫", "Shy"],
                ["🎨", "Creative"],
                ["🧗", "Adventurous"],
                ["😌", "Calm"],
                ["😂", "Funny"],
                ["🔍", "Curious"],
                ["😊", "Optimistic"],
                ["🤓", "Intelligent"],
                ["🤝", "Friendly"],
                ["🧘", "Patient"],
                ["🦁", "Brave"]
            ],

            [
                ["🎮", "Gaming"],
                ["📚", "Reading"],
                ["🍳", "Cooking"],
                ["🏊", "Swimming"],
                ["🎨", "Drawing"],
                ["✈️", "Travel"],
                ["📸", "Photography"],
                ["🎵", "Music"],
                ["💃", "Dancing"],
                ["✍️", "Writing"],
                ["⚽", "Sports"],
                ["🌱", "Gardening"],
                ["🥾", "Hiking"],
                ["🎣", "Fishing"],
                ["💻", "Coding"]
            ]
        ];

        const reels = Array.from(
            { length: 7 },
            (_, i) => document.getElementById("r" + (i + 1))
        );

        const lever = document.getElementById("lever");
        const message = document.getElementById("message");

        let busy = false;

        function randomValue(category) {
            return category[
                Math.floor(Math.random() * category.length)
            ];
        }

        function showValue(reel, item, index) {
            const gradients = [
                "linear-gradient(120deg, #4a148c, #ad1457)", // Gender
                "linear-gradient(120deg, #b71c1c, #e65100)", // Age
                "linear-gradient(120deg, #ad1457, #7b1fa2)", // Height
                "linear-gradient(120deg, #880e4f, #c2185b)", // Weight
                "linear-gradient(120deg, #6a1b9a, #ad1457)", // Job
                "linear-gradient(120deg, #c62828, #8e24aa)", // Personality
                "linear-gradient(120deg, #e65100, #ad1457)"  // Hobby
            ];
            const isNumber = index >= 1 && index <= 3;

            const gradient = isNumber
                ? "linear-gradient(120deg, #a51d00, #e65100, #8b0000)"
                : gradients[index];

            reel.innerHTML = `
        <div>
            <span class="emoji">${item[0]}</span>
            <span class="${isNumber ? "number" : "value"}"
                style="
                    background: ${gradient};
                    background-clip: text;
                    -webkit-background-clip: text;
                    color: transparent;
                ">
                ${item[1]}
            </span>
        </div>
    `;
        }
        function spin() {

            if (busy) return;

            busy = true;
            message.textContent = "🎰 GENERATING...";

            const revealDelay = 2000; // Time between each reel stopping
            const animations = [];

            // Start ALL reels spinning at the same time.
            reels.forEach((reel, i) => {
                reel.classList.add("spinning");

                animations[i] = setInterval(() => {
                    showValue(reel, randomValue(categories[i]), i);
                }, 110);
            });

            // Stop the reels one by one. Reels that have not stopped
            // keep showing new random values while earlier reels stay fixed.
            let stoppedReels = 0;

            const stopNextReel = () => {
                const reelIndex = stoppedReels;
                const reel = reels[reelIndex];

                clearInterval(animations[reelIndex]);

                showValue(
                    reel,
                    randomValue(categories[reelIndex]),
                    reelIndex
                );

                reel.classList.remove("spinning");
                stoppedReels++;

                if (stoppedReels === reels.length) {
                    message.textContent = "✨ PROFILE GENERATED! ✨";
                    busy = false;
                } else {
                    setTimeout(stopNextReel, revealDelay);
                }
            };

            // The first reel stops after 5 seconds; each following
            // reel stops 5 seconds after the previous one.
            setTimeout(stopNextReel, revealDelay);
        }

        // LEVER

        let dragging = false;
        let startY = 0;
        let dragDistance = 0;

        lever.addEventListener("pointerdown", e => {

            if (busy) return;

            dragging = true;
            startY = e.clientY;
            dragDistance = 0;

            lever.style.transition = "none";
            lever.setPointerCapture(e.pointerId);

        });

        lever.addEventListener("pointermove", e => {

            if (!dragging) return;

            dragDistance = Math.max(
                0,
                Math.min(100, e.clientY - startY)
            );

            lever.style.transform =
                `translateY(${dragDistance}px)`;

        });

        function releaseLever() {

            if (!dragging) return;

            dragging = false;

            lever.style.transition = "transform .3s ease";

            if (dragDistance >= 65) {

                lever.style.transform = "translateY(65px)";

                setTimeout(() => {

                    lever.style.transform = "translateY(0)";
                    spin();

                }, 350);

            } else {

                lever.style.transform = "translateY(0)";

            }
        }

        lever.addEventListener("pointerup", releaseLever);
        lever.addEventListener("pointercancel", releaseLever);

    </script>

</body>

</html>
